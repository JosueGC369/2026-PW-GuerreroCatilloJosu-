<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registrar Asistencia - CECyT 9</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header> <a href="./detalle.html">Vilver al detalle del Taller</a></header>

    <main>
        <form class="formulario-registro">
            <h1>Formulario de Registro de Asistencia</h1>

            <div class="registro-exitoso" style="display: none;">Su registro de asistencia ha sido exitoso</div>
            <div class="registro-fallido" style="display: none;">Error: Verifique que sus datos sean correctos</div>

            <label for="nombre">Nombre Completo:"</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="boleta">Numero de Boleta:</label>
            <input type="text" id="boleta" name="boleta" required>

            <button type="submit">Registrar Asitencia</button>
        </form>
    </main>

</body>
</html>
